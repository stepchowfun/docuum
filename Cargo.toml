[package]
name = "docuum"
version = "0.27.3"
edition = "2024"
description = "LRU eviction of Docker images."
documentation = "https://github.com/stepchowfun/docuum"
readme = "README.md"
repository = "https://github.com/stepchowfun/docuum"
license = "MIT"

[dependencies]
byte-unit = "5.2.6"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
colored = "3.1.1"
dirs = "7.0.0"
env_logger = "0.11.11"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
log = "0.4.35"
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
yaml_serde = "0.10.7"

[dependencies.ctrlc]
version = "3.5.3"
features = ["termination"]  # [tag:ctrlc_term]

[target.'cfg(target_os = "linux")'.dependencies]
sysinfo = "0.40.4"

[lints]
clippy.all = { level = "deny", priority = -1 }
clippy.default_numeric_fallback = "deny"
clippy.pedantic = { level = "deny", priority = -1 }
rust.warnings = "deny"
